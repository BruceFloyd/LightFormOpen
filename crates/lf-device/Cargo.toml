[package]
name = "lf-device"
description = "Discovery and control of Lightform LF1/LF2 projectors over the local network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1"
gethostname = "1"
if-addrs = "0.15"
prost = "0.14"
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
